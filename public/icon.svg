<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fundo Dark Premium da Plataforma -->
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0f192d"/>
      <stop offset="60%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>

    <!-- Gradiente da Linha de Alta da Bolsa (Esmeralda Lucro -> Dourado Riqueza) -->
    <linearGradient id="chart-line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Gradiente das Barras de Volume / Candlesticks -->
    <linearGradient id="candle-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Brilho Neon para a Linha do Gráfico -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fundo do Ícone do App -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  
  <!-- Borda de proteção externa -->
  <rect x="22" y="22" width="468" height="468" rx="98" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Linhas sutis de Grade do Gráfico de Bolsa (TradingView / B3 Style) -->
  <g stroke="#334155" stroke-width="2" stroke-opacity="0.22" stroke-dasharray="6 6">
    <line x1="70" y1="170" x2="442" y2="170"/>
    <line x1="70" y1="280" x2="442" y2="280"/>
    <line x1="70" y1="390" x2="442" y2="390"/>
    <line x1="180" y1="100" x2="180" y2="420"/>
    <line x1="332" y1="100" x2="332" y2="420"/>
  </g>

  <!-- Barras / Candlesticks de Alta subjacentes (Alusão à Bolsa de Valores) -->
  <!-- Barra 1 (Suporte Esquerdo) -->
  <line x1="104" y1="250" x2="104" y2="400" stroke="#10b981" stroke-width="3" stroke-opacity="0.3"/>
  <rect x="94" y="280" width="20" height="110" rx="4" fill="url(#candle-bar)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Barra 2 (Vale de Rebalanceamento / Aporte no Suporte) -->
  <line x1="256" y1="230" x2="256" y2="400" stroke="#10b981" stroke-width="3" stroke-opacity="0.3"/>
  <rect x="246" y="270" width="20" height="120" rx="4" fill="url(#candle-bar)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Barra 3 (Rompimento de Topo Histórico Direita) -->
  <line x1="408" y1="220" x2="408" y2="400" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.3"/>
  <rect x="398" y="250" width="20" height="140" rx="4" fill="url(#candle-bar)" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.4"/>

  <!-- ========================================================= -->
  <!-- A LETRA 'M' FORMADA PELA LINHA ASCENDENTE DA BOLSA -->
  <!-- ========================================================= -->
  <g filter="url(#glow)">
    <!-- O Traçado do M: Base Esquerda -> Topo 1 -> Vale Central -> Topo Histórico 2 -> Base Direita -->
    <path d="M 104 390 L 180 170 L 256 290 L 336 130 L 408 390"
          fill="none"
          stroke="url(#chart-line)"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Seta Ascendente de Rompimento no segundo topo do M (All-Time High) -->
    <path d="M 336 130 L 400 70"
          fill="none"
          stroke="#fbbf24"
          stroke-width="40"
          stroke-linecap="round"/>
    
    <!-- Ponta da Seta Financeira -->
    <path d="M 350 70 H 404 V 124"
          fill="none"
          stroke="#fbbf24"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Pontos Luminosos de Cotação nos Vértices Chave -->
    <!-- Nó do Topo 1 -->
    <circle cx="180" cy="170" r="14" fill="#ffffff" stroke="#10b981" stroke-width="6"/>
    <!-- Nó do Aporte (Vale Central de Desconto) -->
    <circle cx="256" cy="290" r="14" fill="#10b981" stroke="#ffffff" stroke-width="5"/>
    <!-- Nó do Topo 2 (Rompimento) -->
    <circle cx="336" cy="130" r="14" fill="#fbbf24" stroke="#ffffff" stroke-width="5"/>
  </g>
</svg>
