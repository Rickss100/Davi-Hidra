<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Fundo Dark Premium com borda esmeralda -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.35"/>
  
  <!-- Letra M estilizada em Esmeralda (Raízes e Firmeza) e Dourado (Crescimento e Prosperidade) -->
  <!-- Coluna Esquerda do M -->
  <path d="M120 376V156" fill="none" stroke="url(#emerald)" stroke-width="44" stroke-linecap="round"/>
  
  <!-- Vértice Central do M (Em V invertido ascendente) -->
  <path d="M120 156L256 316L392 156" fill="none" stroke="url(#gold)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Coluna Direita do M com Seta de Crescimento Antifrágil -->
  <path d="M392 156V376" fill="none" stroke="url(#emerald)" stroke-width="44" stroke-linecap="round"/>
  
  <!-- Ponto Dourado Central de Equilíbrio / Cisne Negro (Barbell Balance) -->
  <circle cx="256" cy="380" r="22" fill="url(#gold)"/>
</svg>
