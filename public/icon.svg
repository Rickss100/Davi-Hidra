<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fundo Obsidian Dark com profundidade radial -->
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#111c33"/>
      <stop offset="60%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>

    <!-- Gradiente de Luz Dourada Superior (Reflexo de Crista) -->
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Gradiente de Ouro Profundo (Sombra das Facetas) -->
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Gradiente Esmeralda Antifrágil (Reforço Biológico/Mineral) -->
    <linearGradient id="emerald-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Sombra Projetada para o M flutuar em 3D -->
    <filter id="m-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base do Ícone (App Icon) -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  
  <!-- Anel de Blindagem com sutil pulso esmeralda -->
  <rect x="22" y="22" width="468" height="468" rx="98" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.28"/>

  <!-- ======================================================== -->
  <!-- O M ANTIFRÁGIL (ESTRUTURA DE OSSO CALCIFICADO EM RELEVO) -->
  <!-- ======================================================== -->
  <g filter="url(#m-shadow)">
    <!-- 1. Silhueta de Base do M (Corpo Sólido e Nítido em qualquer escala) -->
    <path d="M 88 392 L 88 136 L 160 136 L 256 276 L 352 136 L 424 136 L 424 392 L 356 392 L 356 244 L 276 360 L 236 360 L 156 244 L 156 392 Z"
          fill="#1c1917" stroke="#0f172a" stroke-width="8" stroke-linejoin="round"/>

    <!-- 2. Perna Esquerda: Faceta Iluminada (Luz 3D Chanfrada) -->
    <path d="M 88 392 L 88 136 L 122 136 L 122 392 Z" fill="url(#gold-light)"/>
    <!-- Perna Esquerda: Faceta Sombreada -->
    <path d="M 122 136 L 160 136 L 160 392 L 122 392 Z" fill="url(#gold-dark)"/>

    <!-- 3. Diagonal Descendente Esquerda (Do ombro esquerdo ao centro) -->
    <!-- Faceta Superior/Iluminada -->
    <path d="M 122 136 L 160 136 L 256 276 L 236 298 Z" fill="url(#gold-light)"/>
    <!-- Faceta Inferior/Sombreada -->
    <path d="M 156 244 L 236 360 L 256 320 L 210 254 Z" fill="url(#gold-dark)"/>

    <!-- 4. Diagonal Ascendente Direita (Do centro ao ombro direito) -->
    <!-- Faceta Superior/Iluminada -->
    <path d="M 256 276 L 352 136 L 390 136 L 276 298 Z" fill="url(#gold-light)"/>
    <!-- Faceta Inferior/Sombreada -->
    <path d="M 236 360 L 276 360 L 356 244 L 302 254 Z" fill="url(#gold-dark)"/>

    <!-- 5. Perna Direita: Faceta Iluminada -->
    <path d="M 352 136 L 388 136 L 388 392 L 352 392 Z" fill="url(#gold-light)"/>
    <!-- Perna Direita: Faceta Sombreada -->
    <path d="M 388 136 L 424 136 L 424 392 L 388 392 Z" fill="url(#gold-dark)"/>

    <!-- ======================================================== -->
    <!-- NÓS DE CALCIFICAÇÃO ÓSSEA (OS "CALOS" ANTIFRÁGEIS REFORÇADOS) -->
    <!-- ======================================================== -->
    <!-- Calo 1: Ombro Esquerdo (Articulação Reforçada) -->
    <polygon points="76,144 122,108 172,144 122,168" fill="url(#emerald-glow)" stroke="#064e3b" stroke-width="3"/>
    <circle cx="122" cy="138" r="8" fill="#fef08a"/>

    <!-- Calo 2: Ombro Direito (Articulação Reforçada) -->
    <polygon points="340,144 390,108 436,144 390,168" fill="url(#emerald-glow)" stroke="#064e3b" stroke-width="3"/>
    <circle cx="390" cy="138" r="8" fill="#fef08a"/>

    <!-- Calo Central: O Vértice Inferior (A Fratura Cicatrizada que ficou Mais Forte) -->
    <!-- Losango de Titânio & Esmeralda no ponto de maior tensão mecânica -->
    <polygon points="256,290 300,344 256,396 212,344" fill="url(#emerald-glow)" stroke="#fef08a" stroke-width="4"/>
    <circle cx="256" cy="344" r="14" fill="url(#gold-light)"/>

    <!-- Crista de Luz Dourada de reforço nas duas bases inferiores -->
    <rect x="80" y="386" width="84" height="12" rx="4" fill="url(#gold-light)"/>
    <rect x="348" y="386" width="84" height="12" rx="4" fill="url(#gold-light)"/>
  </g>
</svg>
