<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fundo Obsidian Dark com suave degrade radial -->
    <radialGradient id="bg-radial" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#111e2e"/>
      <stop offset="60%" stop-color="#080f18"/>
      <stop offset="100%" stop-color="#03070c"/>
    </radialGradient>

    <!-- Gradiente da Linha MANTFRAI: Esmeralda Neon -> Ouro Imperial -->
    <linearGradient id="line-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="28%" stop-color="#10b981"/>
      <stop offset="65%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Neon de Alta Intensidade -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#10b981" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#fbbf24" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base com Cantos Arredondados PWA/App -->
  <rect width="512" height="512" rx="112" fill="url(#bg-radial)"/>
  
  <!-- Borda Delicada de Protecao -->
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Grade Suave de Bolsa de Valores (Candlestick Terminal) -->
  <g stroke="#334155" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="6 6">
    <line x1="80" y1="200" x2="432" y2="200"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
    <line x1="180" y1="90" x2="180" y2="430"/>
    <line x1="340" y1="90" x2="340" y2="430"/>
  </g>

  <!-- ======================================================== -->
  <!-- A LETRA 'M' INCONFUNDIVEL EM FORMA DE GRAFICO DE BOLSA   -->
  <!-- ======================================================== -->
  <g filter="url(#glow)">
    <!-- Linhas verticais finas de Candlestick (Pavio/Sombra) nos Picos -->
    <line x1="190" y1="105" x2="190" y2="195" stroke="#00e676" stroke-width="8" stroke-linecap="round" stroke-opacity="0.75"/>
    <line x1="348" y1="65" x2="348" y2="160" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-opacity="0.75"/>

    <!-- O Tracado Oficial do M: Base Esquerda -> Topo 1 -> Correcao/Aporte -> Topo Historico (ATH) -> Base Direita -->
    <path d="M 96 384 L 190 148 L 256 280 L 348 108 L 416 384"
          fill="none"
          stroke="url(#line-grad)"
          stroke-width="50"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Seta de Rompimento no Topo Historico (Rumo ao Infinito) -->
    <path d="M 348 108 L 418 52"
          fill="none"
          stroke="#fbbf24"
          stroke-width="40"
          stroke-linecap="round"/>
    <path d="M 368 52 H 420 V 104"
          fill="none"
          stroke="#fbbf24"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Candlesticks / Nos de Cotacao Luminosos nos 5 Vertices -->
    <!-- Base 1 -->
    <circle cx="96" cy="384" r="16" fill="#ffffff" stroke="#00e676" stroke-width="8"/>
    <!-- Topo 1 -->
    <circle cx="190" cy="148" r="16" fill="#ffffff" stroke="#00e676" stroke-width="8"/>
    <!-- Vale RDM (Aporte Antifragil no fundo ascendente) -->
    <circle cx="256" cy="280" r="16" fill="#10b981" stroke="#ffffff" stroke-width="8"/>
    <!-- Topo 2 (Rompimento Dourado) -->
    <circle cx="348" cy="108" r="16" fill="#fbbf24" stroke="#ffffff" stroke-width="8"/>
    <!-- Base 2 -->
    <circle cx="416" cy="384" r="16" fill="#ffffff" stroke="#fbbf24" stroke-width="8"/>
  </g>
</svg>