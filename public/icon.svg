<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fundo Dark Premium da Plataforma MANTFRAI -->
    <radialGradient id="grad-bg-mantfrai" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="65%" stop-color="#081016"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- Gradiente da Linha de Alta da Bolsa (Esmeralda B3 -> Dourado Riqueza) -->
    <linearGradient id="line-mantfrai" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="38%" stop-color="#10b981"/>
      <stop offset="72%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Brilho Neon e Sombra de Profundidade -->
    <filter id="glow-mantfrai" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Base Sólida do Ícone com Cantos Arredondados PWA -->
  <rect width="512" height="512" rx="112" fill="url(#grad-bg-mantfrai)"/>
  
  <!-- Borda de Proteção Externa Sutil -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Grade Sutíl de Análise Técnica / B3 Terminal -->
  <g stroke="#334155" stroke-width="2" stroke-opacity="0.28" stroke-dasharray="8 8">
    <line x1="80" y1="200" x2="432" y2="200"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
    <line x1="180" y1="110" x2="180" y2="420"/>
    <line x1="332" y1="110" x2="332" y2="420"/>
  </g>

  <!-- ======================================================== -->
  <!-- A LETRA 'M' EM PIVÔ DE ALTA DA BOLSA (MANTFRAI OPÇÃO A) -->
  <!-- ======================================================== -->
  <g filter="url(#glow-mantfrai)">
    <!-- O Traçado do M: Suporte Base -> Topo 1 -> Vale de Desconto (Aporte RDM) -> Topo Histórico -> Suporte Reteste -->
    <path d="M 104 380 L 180 160 L 256 280 L 332 120 L 408 380"
          fill="none"
          stroke="url(#line-mantfrai)"
          stroke-width="50"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Seta Ascendente de Rompimento no Topo Histórico (All-Time High) -->
    <path d="M 332 120 L 396 66"
          fill="none"
          stroke="#fbbf24"
          stroke-width="40"
          stroke-linecap="round"/>
    
    <!-- Ponta da Seta Financeira -->
    <path d="M 350 66 H 398 V 114"
          fill="none"
          stroke="#fbbf24"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Candlestick / Nós de Cotação Luminosos nos Vértices Chave -->
    <!-- Nó do Topo 1 -->
    <circle cx="180" cy="160" r="15" fill="#ffffff" stroke="#10b981" stroke-width="7"/>
    <!-- Nó do Aporte (Vale Central de Desconto) -->
    <circle cx="256" cy="280" r="15" fill="#10b981" stroke="#ffffff" stroke-width="7"/>
    <!-- Nó do Topo 2 (Rompimento Dourado) -->
    <circle cx="332" cy="120" r="15" fill="#fbbf24" stroke="#ffffff" stroke-width="7"/>
  </g>
</svg>
